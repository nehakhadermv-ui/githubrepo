<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NK — a portfolio exploring code, design and learning in public.">
  <title>GitHub Workshop</title>
  <style>
    :root {
      --paper: #f4f1e9;
      --ink: #202820;
      --muted: #596253;
      --green: #d7ff65;
      --line: #cdd0c3;
    }
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 17px/1.65 system-ui, -apple-system, sans-serif;
    }
    a {
      color: inherit;
      text-underline-offset: 5px;
    }
    a:focus-visible {
      outline: 3px solid #697f22;
      outline-offset: 6px;
    }
    .wrap {
      width: min(1160px, 90%);
      margin: auto;
    }
    .skip {
      position: absolute;
      left: -9999px;
    }
    .skip:focus {
      left: 20px;
      top: 20px;
      background: white;
      padding: 12px;
      z-index: 5;
    }
    header {
      border-bottom: 1px solid var(--line);
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding: 25px 0;
    }
    .brand {
      font-weight: 850;
      text-decoration: none;
      letter-spacing: -1px;
      font-size: 24px;
    }
    .brand span {
      color: #647d2c;
    }
    .links {
      display: flex;
      gap: 28px;
      font-size: 14px;
    }
    .links a {
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .hero {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      align-items: center;
      gap: 60px;
      padding: 90px 0 80px;
    }
    .eyebrow {
      font: 700 12px/1.5 ui-monospace, monospace;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .eyebrow:before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #647d2c;
      margin-right: 10px;
    }
    h1 {
      font-size: clamp(54px, 7.6vw, 100px);
      letter-spacing: -.075em;
      line-height: 1.02;
      margin: 24px 0;
    }
    h1 em {
      font-family: Georgia, serif;
      font-weight: normal;
    }
    .intro {
      max-width: 470px;
      color: var(--muted);
      font-size: 19px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
      margin-top: 32px;
    }
    .button {
      display: inline-block;
      background: var(--ink);
      color: var(--paper);
      padding: 14px 22px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .button:hover {
      background: #415034;
    }
    .textlink {
      font-size: 14px;
      font-weight: 650;
    }
    .art {
      background: var(--green);
      aspect-ratio: 1;
      position: relative;
      border-radius: 50% 50% 4px 4px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .art:before,
    .art:after {
      content: "";
      position: absolute;
      border: 1px solid #637938;
      border-radius: 50%;
      width: 76%;
      height: 76%;
    }
    .art:after {
      width: 110%;
      height: 40%;
      transform: rotate(-35deg);
    }
    .symbol {
      font: 700 clamp(60px, 9vw, 125px)/1 ui-monospace, monospace;
      z-index: 1;
      transform: rotate(-8deg);
    }
    .art-label {
      position: absolute;
      bottom: 23px;
      left: 24px;
      font: 12px ui-monospace, monospace;
    }
    .strip {
      border-block: 1px solid var(--line);
      padding: 18px 0;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      font: 12px ui-monospace, monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    section {
      padding: 80px 0;
      scroll-margin-top: 20px;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 32px;
    }
    h2 {
      font-size: clamp(34px, 4vw, 52px);
      line-height: 1.12;
      letter-spacing: -2px;
      margin: 10px 0;
    }
    h3 {
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: -.7px;
    }
    .section-head p {
      color: var(--muted);
      max-width: 330px;
    }
    .projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 26px;
    }
    .project {
      border-top: 1px solid var(--ink);
      padding-top: 16px;
    }
    .project-top {
      display: flex;
      justify-content: space-between;
      font: 12px ui-monospace, monospace;
      margin-bottom: 18px;
    }
    .project-art {
      min-height: 220px;
      padding: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      background: #e1e5d7;
    }
    .browser {
      width: 90%;
      background: var(--paper);
      border: 1px solid #87917e;
      box-shadow: 12px 12px 0 #b6bfaa;
      padding: 20px;
      transform: rotate(-3deg);
    }
    .dots {
      font-size: 11px;
      letter-spacing: 5px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }
    .browser strong {
      font-size: 32px;
      line-height: 1.1;
      display: block;
      margin-top: 15px;
      letter-spacing: -1px;
    }
    .browser small {
      font: 10px ui-monospace, monospace;
    }
    .project p {
      color: var(--muted);
      max-width: 490px;
    }
    .tags {
      font: 12px ui-monospace, monospace;
    }
    .project-art.dark {
      background: #26372b;
      color: var(--green);
    }
    .terminal {
      font: 15px/2 ui-monospace, monospace;
      width: 100%;
    }
    .terminal span {
      color: #a0b49c;
    }
    .about {
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 80px;
    }
    .about-copy p {
      color: var(--muted);
      font-size: 19px;
    }
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 25px;
    }
    .skills span {
      border: 1px solid #bbc1b1;
      border-radius: 30px;
      padding: 7px 15px;
      font-size: 13px;
    }
    .note {
      font: 12px ui-monospace, monospace;
      color: var(--muted);
      margin-top: 25px;
    }
    .contact {
      background: var(--green);
      padding: 55px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 70px;
    }
    .contact h2 {
      max-width: 580px;
    }
    .contact p {
      max-width: 550px;
    }
    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      font: 12px ui-monospace, monospace;
    }
    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
        padding: 55px 0;
        gap: 40px;
      }
      .art {
        max-width: 370px;
        width: 100%;
        justify-self: center;
      }
      .projects,
      .about {
        grid-template-columns: 1fr;
        gap: 35px;
      }
      .section-head {
        display: block;
      }
      .contact {
        display: block;
